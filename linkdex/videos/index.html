<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkDex – Videos</title>
  <link rel="icon" type="image/png" href="../assets/logo_linkdex_512.png?v=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --linkdex-blue: #0060A8; }
    .bg-linkdex { background-color: var(--linkdex-blue); }
    .text-linkdex { color: var(--linkdex-blue); }
    /* Estilo para el simulador de teléfono */
    .video-phone-frame {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      background: #000;
      border: 8px solid #1a1a1a;
      border-radius: 2.5rem;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    video { object-fit: cover; width: 100%; height: 100%; }
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">
  <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/linkdex/" class="flex items-center gap-2">
        <img src="../assets/logo_linkdex_512.png" alt="Logo" class="w-10 h-10 rounded-xl shadow-sm">
        <span class="text-2xl font-bold text-linkdex italic tracking-tighter">LinkDex</span>
      </a>
      <a href="/linkdex/" class="text-sm font-semibold text-gray-600 hover:text-linkdex transition">← Volver</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4 md:p-8">

      <div>
        <h1 id="pageTitle" class="text-2xl md:text-3xl font-extrabold text-linkdex">LinkDex</h1>
        <p id="pageSubtitle" class="text-gray-600 mt-1"></p>
      </div>

      <div class="mt-5">
        <div id="guide" class="max-w-none"></div>

        <details id="guideDetails" class="mt-3 group">
          <summary id="toggleSummary" class="cursor-pointer text-sm font-bold text-linkdex hover:underline flex items-center gap-1">
            <span class="group-open:rotate-90 transition-transform inline-block">▶</span>
            <span id="labelTxt">Ver guía completa</span>
          </summary>
          <div id="guideFull" class="max-w-none mt-3 p-4 bg-gray-50 rounded-2xl border border-gray-100"></div>
        </details>
      </div>

      <div class="mt-10 flex justify-center">
        <div class="video-phone-frame">
          <video id="vid" controls playsinline preload="metadata"></video>
        </div>
      </div>

      <p id="err" class="mt-4 text-sm text-red-600 hidden text-center"></p>

      <div class="mt-10 flex flex-col sm:flex-row gap-3 sm:items-center justify-between border-t pt-6">
        <a href="https://play.google.com/store/apps/details?id=com.dextersoft.linkdex"
           target="_blank"
           class="px-6 py-3 rounded-xl bg-gray-900 text-white text-sm font-bold hover:opacity-90 text-center">
          Abrir en Play Store
        </a>

        <a href="/linkdex/" class="px-6 py-3 rounded-xl bg-white border border-gray-200 text-gray-700 text-sm font-bold hover:bg-gray-50 text-center transition">
          Volver a LinkDex
        </a>
      </div>

    </div>
  </main>

  <script>
    const supported = ["en","es","pt","fr","it","de"];
    const BASE = "https://pub-47e7d8f47e9449bd8c8bda4d376e39a6.r2.dev/linkdex-videos/";

    const HELP_TEXTS = {
      es: {
        pageSubtitle: "Mirá este video corto (menos de 1 minuto). Se selecciona automáticamente según el idioma de tu navegador.",
        headerTitle: "Tu Guía en LinkDex",
        toggleShow: "Abrir guía de uso completa",
        toggleHide: "Ocultar guía completa",
        sections: [
          { title: "¿Qué es LinkDex?", body: "Imagina tener tu propia **biblioteca personal de internet**. LinkDex no es solo un marcador; es el lugar donde guardas artículos, videos, recetas, productos o perfiles de redes sociales que te inspiran.\n\nTodo se organiza a tu manera mediante **Grupos y Tags**, permitiéndote encontrar ese enlace especial en cuestión de segundos, sin importar cuánto tiempo haya pasado." },
          { title: "Uso General", body: "1. Desde cualquier aplicación o sitio web (una red social como Instagram, Facebook, etc), un portal de videos (YouTube, Vimeo, etc), un sitio de noticias, o simplemente una página con un texto que te interese, toca 'compartir' y elige LinkDex, o copia el link y agrégalo dentro de la aplicación.\n\n2. Elige un grupo, edita el título, opcionalmente (recomendado) agrega tags (separados por comas) para facilitar la búsqueda, ¡y listo!" },
          { title: "Registros y Cuentas", body: "Si usas una **Cuenta Anónima**, tus links viven solo en este teléfono. ¡Cuidado! Si cambias de dispositivo o borras la app, perderás tu colección.\n\nAl registrarte con Google, Apple o Correo, activas la **Sincronización en la Nube**. Tus links estarán seguros, respaldados y disponibles en cualquier dispositivo donde inicies sesión." },
          { title: "Manejo de Links", body: "Para mayor agilidad, mantén presionado cualquier link para activar la **Selección Múltiple**. Esto te permite mover o borrar grandes bloques de enlaces a la vez.\n\nAdemás, con la lupa de **Búsqueda Global**, puedes localizar contenido no solo por su título, sino también explorando las etiquetas que hayas asignado a tu colección." },
          { title: "Imágenes y Miniaturas", body: "LinkDex utiliza Miniaturas Inteligentes para capturar la mejor imagen de cada sitio. Sin embargo, algunos sitios con alta seguridad o perfiles privados no permiten que apps externas lea su contenido.\n\nSi un link no muestra imagen, puedes usar la option 'Reparar miniatura' en el menú del enlace para intentar un escaneo profundo y recuperar la previsualización, si es posible." }
        ]
      },
      en: {
        pageSubtitle: "Watch this short video (under 1 minute). It is automatically selected based on your browser language.",
        headerTitle: "Your Guide to LinkDex",
        toggleShow: "Open full user guide",
        toggleHide: "Hide full guide",
        sections: [
          { title: "What is LinkDex?", body: "Imagine having your own **personal internet library**. LinkDex isn't just a bookmark manager; it's the place where you store articles, videos, recipes, products, or social media profiles that inspire you.\n\nEverything is organized your way through **Groups and Tags**, allowing you to find that special link in seconds, no matter how much time has passed." },
          { title: "General Use", body: "1. From any application or website, tap 'share' and choose LinkDex, or copy the link and add it inside the application.\n\n2. Choose a group, edit the title, optionally add tags (separated by commas) to make searching easier, and you're done!" },
          { title: "Accounts and Registration", body: "If you use an **Anonymous Account**, your links live only on this phone. By registering with Google, Apple, or Email, you activate **Cloud Sync**." },
          { title: "Managing Links", body: "For more speed, long-press any link to activate **Multi-Selection**.\n\nAdditionally, with the **Global Search** magnifying glass, you can locate content not just by its title, but also by exploring tags." },
          { title: "Images and Thumbnails", body: "LinkDex uses Smart Thumbnails. If a link does not show an image, use 'Repair thumbnail' for a deep scan." }
        ]
      },
      fr: {
        pageSubtitle: "Regardez cette courte vidéo (moins d'une minute).",
        headerTitle: "Votre Guide LinkDex",
        toggleShow: "Afficher le guide complet",
        toggleHide: "Masquer le guide complet",
        sections: [
          { title: "Qu'est-ce que LinkDex ?", body: "Imaginez avoir votre propre **bibliothèque personnelle d'internet**." },
          { title: "Utilisation", body: "Appuyez sur 'partager' et choisissez LinkDex, ou copiez le lien." }
        ]
      },
      it: {
        pageSubtitle: "Guarda questo breve video (meno di 1 minuto).",
        headerTitle: "La tua Guida LinkDex",
        toggleShow: "Mostra guida completa",
        toggleHide: "Nascondi guida completa",
        sections: [
          { title: "Cos'è LinkDex?", body: "Immagina di avere la tua **biblioteca personale di internet**." },
          { title: "Utilizzo", body: "Tocca 'condividi' e scegli LinkDex, o copia il link." }
        ]
      },
      pt: {
        pageSubtitle: "Assista a este vídeo curto (menos de 1 minuto).",
        headerTitle: "Seu Guia no LinkDex",
        toggleShow: "Abrir guia de uso completo",
        toggleHide: "Ocultar guia completo",
        sections: [
          { title: "O que é o LinkDex?", body: "Imagine ter sua própria **biblioteca pessoal da internet**." },
          { title: "Uso Geral", body: "Toque em 'compartilhar' e escolha o LinkDex, ou copie o link." }
        ]
      },
      de: {
        pageSubtitle: "Sieh dir dieses kurze Video an (unter 1 Minute).",
        headerTitle: "Dein LinkDex Leitfaden",
        toggleShow: "Bedienungsanleitung öffnen",
        toggleHide: "Leitfaden ausblenden",
        sections: [
          { title: "Was ist LinkDex?", body: "Stell dir vor, du hättest deine eigene **persönliche Internet-Bibliothek**." },
          { title: "Nutzung", body: "Tippen Sie auf 'Teilen' und wählen Sie LinkDex." }
        ]
      }
    };

    function pickLang() {
      const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      for (const l of prefs) {
        const code = String(l).toLowerCase().split("-")[0];
        if (supported.includes(code)) return code;
      }
      return "en";
    }

    function videoUrl(lang) {
      return `${BASE}LinkDex-${lang}.mp4`;
    }

    function mdToHtml(s) {
      const safe = String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      return "<p>" + safe.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
    }

    function sectionsHtml(sections) {
      return (sections || []).map(sec => `
        <div class="mb-4">
          <h2 class="text-lg font-bold text-gray-900">${sec.title}</h2>
          <div class="text-gray-700">${mdToHtml(sec.body)}</div>
        </div>
      `).join("");
    }

    function renderGuide(lang) {
      const t = HELP_TEXTS[lang] || HELP_TEXTS.en;
      document.documentElement.lang = lang;
      document.getElementById("pageTitle").textContent = t.headerTitle;
      document.getElementById("pageSubtitle").textContent = t.pageSubtitle;

      document.getElementById("guide").innerHTML = sectionsHtml((t.sections || []).slice(0, 2));
      document.getElementById("guideFull").innerHTML = sectionsHtml((t.sections || []).slice(2));

      const details = document.getElementById("guideDetails");
      const label = document.getElementById("labelTxt");

      const updateToggleLabel = () => {
        label.textContent = details.open ? t.toggleHide : t.toggleShow;
      };
      updateToggleLabel();
      details.addEventListener("toggle", updateToggleLabel);
    }

    function setVideo(lang) {
      const vid = document.getElementById("vid");
      const err = document.getElementById("err");
      const src = videoUrl(lang);
      vid.src = src;
      vid.load();
      vid.onerror = () => {
        err.classList.remove("hidden");
        err.textContent = `No se pudo cargar el video (${lang}).`;
      };
    }

    const lang = pickLang();
    renderGuide(lang);
    setVideo(lang);
  </script>
</body>
</html>
