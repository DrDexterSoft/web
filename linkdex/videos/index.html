<body class="bg-gray-50 text-gray-900">

        <span class="text-2xl font-bold text-linkdex italic tracking-tighter">LinkDex</span>
      </a>
      <a href="/linkdex/" class="text-sm font-semibold text-gray-600 hover:text-linkdex transition">← Volver</a>
    </div>

  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4 md:p-6">

      <div>
        <h1 id="pageTitle" class="text-2xl md:text-3xl font-extrabold text-linkdex">LinkDex</h1>
        <p id="pageSubtitle" class="text-gray-600 mt-1"></p>
      </div>

      <div class="mt-5">
        <div id="guide" class="max-w-none"></div>

        <details id="guideDetails" class="mt-3 group">
          <summary id="toggleSummary" class="cursor-pointer text-sm font-bold text-linkdex hover:underline list-none">
            Cargando guía...
          </summary>
          <div id="guideFull" class="max-w-none mt-3 border-t border-gray-100 pt-3"></div>
        </details>
      </div>

      <div class="mt-6 rounded-2xl overflow-hidden bg-black shadow-lg">
        <video id="vid" class="w-full aspect-video" controls playsinline preload="metadata"></video>
      </div>

      <p id="err" class="mt-4 text-sm text-red-600 hidden bg-red-50 p-3 rounded-lg"></p>

      <div class="mt-8 flex flex-col sm:flex-row gap-3 sm:items-center justify-between border-t pt-6">
        <a href="https://play.google.com/store/apps/details?id=com.dextersoft.linkdex"
           target="_blank"
           class="px-6 py-3 rounded-xl bg-gray-900 text-white text-sm font-bold hover:bg-black transition text-center">
          Abrir en Play Store
        </a>

        <a href="/linkdex/" class="px-6 py-3 rounded-xl bg-white border border-gray-200 text-gray-700 text-sm font-bold hover:bg-gray-50 transition text-center">
          Volver a LinkDex
        </a>
      </div>

    </div>
  </main>

  <script>

          { title: "What is LinkDex?", body: "Imagine having your own **personal internet library**. LinkDex is where you store articles, videos, and profiles that inspire you." },

        toggleHide: "↓ Masquer le guide",
        sections: [
          { title: "Qu'est-ce que LinkDex ?", body: "Votre propre **bibliothèque personnelle d'internet**." },

        sections: [
          { title: "Was ist LinkDex?", body: "Deine eigene **persönliche Internet-Bibliothek**." },

          { title: "Verwaltung", body: "Gedrückt halten für **Mehrfachauswahl**." },
          { title: "Bilder", body: "Option 'Vorschaubild reparieren' nutzen." }
        ]
      }
    };

    function pickLang() {
      const prefs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || "en"];

      for (const l of prefs) {
        const code = String(l).toLowerCase().split("-")[0];
        if (supported.includes(code)) return code;
      }
      return "en";
    }

    function mdToHtml(s) {
      const safe = String(s || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

      return "<p>" + safe
        .replace(/\n\n+/g, "</p><p>")
        .replace(/\n/g, "<br>") + "</p>";
    }

    function sectionsHtml(sections) {
      return (sections || []).map(sec => `
        <div class="mb-4">
          <h2 class="text-lg font-bold text-gray-900">${sec.title}</h2>
          <div class="text-gray-700 text-sm leading-relaxed">${mdToHtml(sec.body)}</div>
        </div>
      `).join("");
    }

    function renderGuide(lang) {
      const t = HELP_TEXTS[lang] || HELP_TEXTS.en;
      document.documentElement.lang = lang;

      document.getElementById("pageTitle").textContent = t.headerTitle;
      document.getElementById("pageSubtitle").textContent = t.pageSubtitle;

      const topSections = (t.sections || []).slice(0, 2);
      const restSections = (t.sections || []).slice(2);

      document.getElementById("guide").innerHTML = sectionsHtml(topSections);
      document.getElementById("guideFull").innerHTML = sectionsHtml(restSections);

      const details = document.getElementById("guideDetails");
      const summary = document.getElementById("toggleSummary");

      const updateLabels = () => {
        summary.textContent = details.open ? t.toggleHide : t.toggleShow;
      };

      // Inicializar etiqueta
      updateLabels();
      // Escuchar el cambio
      details.addEventListener("toggle", updateLabels);
    }

    function setVideo(lang) {
      const vid = document.getElementById("vid");
      const err = document.getElementById("err");
      const src = `${BASE}LinkDex-${lang}.mp4`;
      
      vid.src = src;
      vid.load();

      vid.onerror = () => {
        err.classList.remove("hidden");
        err.textContent = `Error: Video not found (${lang}).`;
      };
    }

    // Ejecución inmediata
    const currentLang = pickLang();
    renderGuide(currentLang);
    setVideo(currentLang);
  </script>
</body>
</html>
