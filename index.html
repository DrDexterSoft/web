    <script type="text/javascript">
        // Redirección inmediata
        // Usamos la URL completa para evitar problemas de rutas relativas en Netlify

        if (window.location.protocol !== 'file:') {
            window.location.replace(targetURL);
        }
    </script>

</head>

        <p>Si no eres redirigido en 2 segundos, <a href="./linkdex/index.html" style="color: #93C5FD; font-weight: bold;">haz clic aquí</a>.</p>
    </div>
</body>
</html>
