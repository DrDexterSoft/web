      supportTitle: "Support",

      supportText: "Kontakt: "

  function applyLanguage(lang) {
    const t = translations[lang] || translations.en;

    document.documentElement.lang = lang;

    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("intro").textContent = t.intro;

    document.getElementById("howTitle").textContent = t.howTitle;

    const howSteps = document.getElementById("howSteps");
    howSteps.innerHTML = "";

    t.howSteps.forEach(step => {
      const li = document.createElement("li");
      li.textContent = step;
      howSteps.appendChild(li);
    });

    document.getElementById("deletedTitle").textContent = t.deletedTitle;

    const deletedItems = document.getElementById("deletedItems");
    deletedItems.innerHTML = "";

    t.deletedItems.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      deletedItems.appendChild(li);
    });

    document.getElementById("externalTitle").textContent = t.externalTitle;
    document.getElementById("externalText").textContent = t.externalText;

    document.getElementById("supportTitle").textContent = t.supportTitle;
    document.getElementById("supportText").textContent = t.supportText;

    document.getElementById("languageSelector").value = lang;
  }

  const browserLang = navigator.language.slice(0, 2);

  const supported = ["en", "es", "pt", "fr", "it", "de"];

  const initialLang = supported.includes(browserLang)
          ? browserLang
          : "en";

  applyLanguage(initialLang);

  document
          .getElementById("languageSelector")
          .addEventListener("change", (e) => {
            applyLanguage(e.target.value);
          });
</script>

</body>
</html>
