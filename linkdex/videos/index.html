function pickLang() {
      const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      for (const l of prefs) {
        const code = String(l).toLowerCase().split("-")[0];
        if (supported.includes(code)) return code;
      }
      return "en";
    }

    function videoUrl(lang) {
      if (!supported.includes(lang)) lang = "en";
      return `${BASE}LinkDex-${lang}.mp4`;
    }

    function mdToHtml(s) {
      const safe = String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      return "<p>" + safe.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
    }

    function sectionsHtml(sections) {
      return (sections || []).map(sec => `
        <div class="mb-4">
          <h2 class="text-lg font-bold text-gray-900">${sec.title}</h2>
          <div class="text-gray-700">${mdToHtml(sec.body)}</div>
        </div>
      `).join("");
    }

    function renderGuide(lang) {
      const t = HELP_TEXTS[lang] || HELP_TEXTS.en;
      document.documentElement.lang = lang;
      document.getElementById("pageTitle").textContent = t.headerTitle;
      document.getElementById("pageSubtitle").textContent = t.pageSubtitle;
      document.getElementById("guide").innerHTML = sectionsHtml((t.sections || []).slice(0, 2));
      document.getElementById("guideFull").innerHTML = sectionsHtml((t.sections || []).slice(2));
      const details = document.getElementById("guideDetails");
      const label = document.getElementById("labelTxt");
      const updateToggleLabel = () => { label.textContent = details.open ? t.toggleHide : t.toggleShow; };
      details.addEventListener("toggle", updateToggleLabel);
      updateToggleLabel();
    }

    function setVideo(lang) {
      const vid = document.getElementById("vid");
      const err = document.getElementById("err");
      let current = lang;
      const load = (l) => {
        vid.src = videoUrl(l);
        vid.load();
      };
      vid.onerror = () => {
        if (current !== "en") { load("en"); current = "en"; }
        else { err.classList.remove("hidden"); err.textContent = "Error loading video."; }
      };
      load(lang);
    }

    // Lógica de Scroll Unificada
    const handleScroll = () => {
      if (window.location.hash === '#video') {
        const element = document.getElementById('video');
        if (element) {
          const yOffset = -100; // Espacio para el menú superior
          const y = element.getBoundingClientRect().top + window.pageYOffset + yOffset;
          window.scrollTo({ top: y, behavior: 'smooth' });
        }
      }
    };

    // Inicialización Única
    const lang = pickLang();
    renderGuide(lang);
    setVideo(lang);

    // Eventos de Scroll
    window.addEventListener('load', () => {
      setTimeout(handleScroll, 100);
      setTimeout(handleScroll, 500);
      setTimeout(handleScroll, 1200); // Tercer intento para asegurar
    });
    window.addEventListener('hashchange', handleScroll);
  </script>
