<body class="bg-gray-50 text-gray-800 font-sans leading-relaxed">

               <a href="https://instagram.com/drvictoroviedo" target="_blank" class="text-blue-700 font-medium flex items-center gap-2 hover:underline">
                    <i class="fab fa-instagram"></i> @drvictoroviedo
            </div>

            <div class="mt-10 flex justify-center">
                <a href="index.html" class="text-gray-400 hover:text-gray-900 font-bold text-sm transition-colors" data-i18n="back_home"></a>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            es: {
                role: "Médico y Desarrollador",
                app_desc: "LinkDex es un organizador de enlaces diseñado para guardar, clasificar y encontrar fácilmente links importantes de cualquier sitio web o red social.",

                author_title: "Sobre el autor",
                author_bio: "Médico ginecólogo de profesión, apasionado por la tecnología y el desarrollo de aplicaciones útiles para la vida diaria y el trabajo profesional.",
                contact_label: "Contacto",
                back_home: "← Volver al inicio"
            },
            en: {
                role: "Doctor & Developer",
                app_desc: "LinkDex is a link organizer designed to save, classify, and easily find important links from any website or social network.",
                app_details: "It allows you to group links, search them quickly, and keep them organized, even when content gets lost on social platforms.",
                author_title: "About the author",
                author_bio: "Gynecologist by profession, passionate about technology and the development of useful applications for daily life and professional work.",
                contact_label: "Contact",
                back_home: "← Back to Home"
            },
            pt: {
                role: "Médico e Desenvolvedor",
                app_desc: "O LinkDex é um organizador de links projetado para salvar, classificar e encontrar facilmente links importantes de qualquer site ou rede social.",
                app_details: "Permite agrupar links, pesquisá-los rapidamente e mantê-los organizados, mesmo quando se perdem nas redes entre muitas curtidas.",
                author_title: "Sobre o autor",
                author_bio: "Médico ginecologista de profissão, apaixonado por tecnologia e pelo desenvolvimento de aplicativos úteis para a vida diária e o trabalho profissional.",
                contact_label: "Contato",
                back_home: "← Voltar ao início"
            },
            it: {
                role: "Medico e Sviluppatore",
                app_desc: "LinkDex è un organizzatore di link progettato per salvare, classificare e trovare facilmente link importanti da qualsiasi sito web o social network.",
                app_details: "Consente di raggruppare i link, cercarli rapidamente e tenerli organizzati, anche quando si perdono sui social tra i tanti \"mi piace\".",
                author_title: "L'autore",
                author_bio: "Medico ginecologo di professione, appassionato di tecnologia e dello sviluppo di applicazioni utili per la vita quotidiana e il lavoro professionale.",
                contact_label: "Contatti",
                back_home: "← Torna alla home"
            },
            fr: {
                role: "Médecin et Développeur",
                app_desc: "LinkDex est un organisateur de liens conçu pour enregistrer, classer et trouver facilement des liens importants à partir de n'importe quel site Web ou réseau social.",
                app_details: "Il permet de regrouper les liens, de les rechercher rapidement et de les organiser, même lorsqu'ils se perdent sur les réseaux parmi de nombreux \"j'aime\".",
                author_title: "À propos de l'auteur",
                author_bio: "Gynécologue de profession, passionné par la technologie et le développement d'applications utiles pour la vie quotidienne et le travail professionnel.",
                contact_label: "Contact",
                back_home: "← Retour à l'accueil"
            },
            de: {
                role: "Arzt und Entwickler",
                app_desc: "LinkDex ist ein Link-Organizer, mit dem Sie wichtige Links von jeder Website oder jedem sozialen Netzwerk einfach speichern, klassifizieren und finden können.",
                app_details: "Es ermöglicht Ihnen, Links zu gruppieren, sie schnell zu suchen und sie organisiert zu halten, auch wenn sie in sozialen Netzwerken zwischen vielen \"Likes\" verloren gehen.",
                author_title: "Über den Autor",
                author_bio: "Gynäkologe von Beruf, mit einer Leidenschaft für Technologie und die Entwicklung nützlicher Anwendungen für den Alltag und die berufliche Arbeit.",
                contact_label: "Kontakt",
                back_home: "← Zurück zur Startseite"
            }
        };

        function applyLanguage() {
            const userLang = navigator.language.split('-')[0];
            const lang = translations[userLang] ? userLang : 'en'; // Inglés por defecto
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        window.onload = applyLanguage;
    </script>
</body>
</html>
