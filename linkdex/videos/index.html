function pickLang() {
      const prefs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || "en"];

      for (const l of prefs) {
        const code = String(l).toLowerCase().split("-")[0];
        if (supported.includes(code)) return code;
      }
      return "en";
    }

    function videoUrl(lang) {
      // ⚠️ Asegurate que tus objetos se llamen EXACTO: LinkDex-es.mp4, LinkDex-en.mp4, etc.
      return `${BASE}LinkDex-${lang}.mp4`;
    }

    function mdToHtml(s) {
      const safe = String(s || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

      return "<p>" + safe
        .replace(/\n\n+/g, "</p><p>")
        .replace(/\n/g, "<br>") + "</p>";
    }

    function sectionsHtml(sections) {
      return (sections || []).map(sec => `
        <div class="mb-4">
          <h2 class="text-lg font-bold text-gray-900">${sec.title}</h2>
          <div class="text-gray-700">${mdToHtml(sec.body)}</div>
        </div>
      `).join("");
    }

    function renderGuide(lang) {
      const t = HELP_TEXTS[lang] || HELP_TEXTS.en;

      // Ajusta atributo lang del documento (mejor accesibilidad)
      document.documentElement.lang = lang;

      document.getElementById("pageTitle").textContent = t.headerTitle || "LinkDex";
      document.getElementById("pageSubtitle").textContent = t.pageSubtitle || "";

      const topSections = (t.sections || []).slice(0, 2);
      const restSections = (t.sections || []).slice(2);

      document.getElementById("guide").innerHTML = sectionsHtml(topSections);
      document.getElementById("guideFull").innerHTML = sectionsHtml(restSections);

      // Toggle traducido + cambia según open/close
      const details = document.getElementById("guideDetails");
      const summary = document.getElementById("toggleSummary");

      function updateToggleLabel() {
        summary.textContent = details.open
          ? (t.toggleHide || "Hide full guide")
          : (t.toggleShow || "Show full guide");
      }
      updateToggleLabel();
      details.addEventListener("toggle", updateToggleLabel);
    }

    function setVideo(lang) {
      const vid = document.getElementById("vid");
      const err = document.getElementById("err");

      err.classList.add("hidden");
      err.textContent = "";

      const src = videoUrl(lang);
      vid.src = src;

      // Forzamos carga
      vid.load();

      vid.onerror = () => {
        err.classList.remove("hidden");
        err.textContent = `No se pudo cargar el video (${lang}). URL: ${src}`;
      };
    }

    // INIT
    const lang = pickLang();
    renderGuide(lang);
    setVideo(lang);
  </script>
