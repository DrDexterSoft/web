                   class="text-blue-700 font-medium flex items-center gap-2 hover:underline">

                </a>
            </div>
        </div>

        <!-- Back -->
        <div class="mt-10 flex justify-center">
            <a href="index.html"
               class="text-gray-400 hover:text-gray-900 font-bold text-sm transition-colors"
               data-i18n="back_home">

        </div>

</div>

<script>

    it: {

        app_desc: "Dextograma è un calcolatore di età gestazionale progettato per uso professionale e personale.",
        app_details: "Consente il calcolo tramite LMP o prima ecografia, fornisce le date chiave tra le settimane 37 e 42 ed esegue calcoli per date future in modo rapido e preciso.",

        app_details: "Il permet le calcul par DDR ou première échographie, fournit les dates clés entre 37 et 42 semaines et effectue des calculs pour des dates futures de manière rapide et précise.",
        author_title: "À propos de l'auteur",

    de: {
        role: "Arzt und Entwickler",
        app_desc: "Dextograma ist ein Rechner für das Schwangerschaftsalter, entwickelt für den professionellen und persönlichen Gebrauch.",

        back_home: "← Zur Startseite"
    }
};

function applyLanguage() {
    const userLang = navigator.language.split('-')[0];
    const lang = translations[userLang] ? userLang : 'en';

    document.documentElement.lang = lang;

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
            el.innerHTML = translations[lang][key];
        }
    });
}

window.onload = applyLanguage;
</script>

</body>
