<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkDex – Videos</title>
  <link rel="icon" type="image/png" href="../assets/logo_linkdex_512.png?v=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --linkdex-blue: #0060A8; }
    .bg-linkdex { background-color: var(--linkdex-blue); }
    .text-linkdex { color: var(--linkdex-blue); }
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
    video { object-fit: cover; background-color: #000; }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">
  <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/linkdex/" class="flex items-center gap-2">
        <img src="../assets/logo_linkdex_512.png" alt="Logo" class="w-10 h-10 rounded-xl shadow-sm">
        <span class="text-2xl font-bold text-linkdex italic tracking-tighter">LinkDex</span>
      </a>
      <a href="/linkdex/" class="text-sm font-semibold text-gray-600 hover:text-linkdex transition">← Volver</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 md:p-8">

      <div class="mb-6">
        <h1 id="pageTitle" class="text-2xl md:text-3xl font-extrabold text-linkdex">LinkDex</h1>
        <p id="pageSubtitle" class="text-gray-600 mt-1"></p>
      </div>

      <div class="mt-5 mb-8">
        <div id="guide" class="max-w-none"></div>

        <details id="guideDetails" class="mt-3 group">
          <summary id="toggleSummary" class="cursor-pointer text-sm font-bold text-linkdex hover:opacity-80 flex items-center gap-2">
            <span class="inline-block transform group-open:rotate-90 transition-transform duration-200 text-[10px]">▶</span>
            <span id="labelTxt">Abrir guía de uso</span>
          </summary>
          <div id="guideFull" class="mt-4 bg-gray-50 p-5 rounded-2xl border border-gray-100"></div>
        </details>
      </div>

      <div class="flex justify-center my-10">
        <div class="relative w-[85%] sm:w-[300px] md:w-[320px] aspect-[9/16] bg-black rounded-[2.5rem] overflow-hidden shadow-2xl border-[8px] border-gray-900 ring-1 ring-gray-200">
          <video id="vid" class="absolute inset-0 w-full h-full" controls playsinline preload="metadata"></video>
        </div>
      </div>

      <p id="err" class="mt-4 text-sm text-red-600 hidden text-center bg-red-50 p-3 rounded-xl"></p>

      <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center items-center border-t border-gray-100 pt-8">
        <a href="https://play.google.com/store/apps/details?id=com.dextersoft.linkdex"
           target="_blank"
           class="w-full sm:w-auto px-8 py-3 rounded-2xl bg-gray-900 text-white text-sm font-bold hover:bg-black transition text-center shadow-lg">
          Abrir en Play Store
        </a>
      </div>

    </div>
  </main>

  <script>
    const supported = ["en","es","pt","fr","it","de"];
    const BASE = "https://pub-47e7d8f47e9449bd8c8bda4d376e39a6.r2.dev/linkdex-videos/";

    const HELP_TEXTS = {
      es: {
        pageSubtitle: "Mirá este video corto (menos de 1 minuto). Se selecciona automáticamente según el idioma de tu navegador.",
        headerTitle: "Tu Guía en LinkDex",
        toggleShow: "Abrir guía de uso completa",
        toggleHide: "Ocultar guía completa",
        sections: [
          { title: "¿Qué es LinkDex?", body: "Imagina tener tu propia **biblioteca personal de internet**. LinkDex no es solo un marcador; es el lugar donde guardas artículos, videos, recetas, productos o perfiles de redes sociales que te inspiran.\n\nTodo se organiza a tu manera mediante **Grupos y Tags**, permitiéndote encontrar ese enlace especial en cuestión de segundos." },
          { title: "Uso General", body: "1. Desde cualquier aplicación o sitio web, toca 'compartir' y elige LinkDex, o copia el link y agrégalo dentro de la aplicación.\n\n2. Elige un grupo, edita el título, opcionalmente agrega tags (separados por comas) para facilitar la búsqueda." },
          { title: "Registros y Cuentas", body: "Si usas una **Cuenta Anónima**, tus links viven solo en este teléfono. Al registrarte con Google, Apple o Correo, activas la **Sincronización en la Nube**." },
          { title: "Manejo de Links", body: "Mantén presionado cualquier link para activar la **Selección Múltiple**. Esto te permite mover o borrar grandes bloques de enlaces a la vez.\n\nCon la **Búsqueda Global**, puedes localizar contenido por título o por etiquetas." },
          { title: "Imágenes y Miniaturas", body: "LinkDex utiliza Miniaturas Inteligentes. Si un link no muestra imagen, puedes usar la opción 'Reparar miniatura' en el menú del enlace para intentar un escaneo profundo." }
        ]
      },
      en: {
        pageSubtitle: "Watch this short video (under 1 minute). It is automatically selected based on your browser language.",
        headerTitle: "Your Guide to LinkDex",
        toggleShow: "Open full user guide",
        toggleHide: "Hide full guide",
        sections: [
          { title: "What is LinkDex?", body: "Imagine having your own **personal internet library**. LinkDex isn't just a bookmark manager; it's the place where you store articles, videos, recipes, or profiles that inspire you." },
          { title: "General Use", body: "1. From any app, tap 'share' and choose LinkDex, or copy/paste the link inside the app.\n\n2. Choose a group, edit the title, and add tags for easy searching." },
          { title: "Accounts", body: "Anonymous accounts are local. Use Google, Apple, or Email for **Cloud Sync** to keep your links backed up and available on any device." },
          { title: "Managing Links", body: "Long-press any link for **Multi-Selection**. Use **Global Search** to find content by title or tags." },
          { title: "Thumbnails", body: "If an image is missing, use 'Repair thumbnail' in the link menu for a deep scan." }
        ]
      },
      fr: {
        pageSubtitle: "Regardez cette courte vidéo (moins d'une minute).",
        headerTitle: "Votre Guide LinkDex",
        toggleShow: "Ouvrir le guide complet",
        toggleHide: "Masquer le guide",
        sections: [
          { title: "Qu'est-ce que LinkDex ?", body: "Votre propre **bibliothèque personnelle d'internet**." },
          { title: "Utilisation", body: "Appuyez sur 'partager' et choisissez LinkDex, o copiez le lien." }
        ]
      },
      it: {
        pageSubtitle: "Guarda questo breve video (meno di 1 minuto).",
        headerTitle: "La tua Guida LinkDex",
        toggleShow: "Apri la guida completa",
        toggleHide: "Nascondi la guida",
        sections: [
          { title: "Cos'è LinkDex?", body: "La tua **biblioteca personale di internet**." },
          { title: "Utilizzo", body: "Tocca 'condividi' e scegli LinkDex, o copia il link." }
        ]
      },
      pt: {
        pageSubtitle: "Assista a este vídeo curto (menos de 1 minuto).",
        headerTitle: "Seu Guia no LinkDex",
        toggleShow: "Abrir guia de uso completo",
        toggleHide: "Ocultar guia completo",
        sections: [
          { title: "O que é o LinkDex?", body: "Sua própria **biblioteca pessoal da internet**." },
          { title: "Uso Geral", body: "Toque em 'compartilhar' e escolha o LinkDex, ou copie o link." }
        ]
      },
      de: {
        pageSubtitle: "Sieh dir dieses kurze Video an (unter 1 Minute).",
        headerTitle: "Dein LinkDex Leitfaden",
        toggleShow: "Bedienungsanleitung öffnen",
        toggleHide: "Leitfaden ausblenden",
        sections: [
          { title: "Was ist LinkDex?", body: "Deine eigene **persönliche Internet-Bibliothek**." },
          { title: "Nutzung", body: "Tippen Sie auf 'Teilen' und wählen Sie LinkDex." }
        ]
      }
    };

    function pickLang() {
      const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      for (const l of prefs) {
        const code = String(l).toLowerCase().split("-")[0];
        if (supported.includes(code)) return code;
      }
      return "en";
    }

    function mdToHtml(s) {
      const safe = String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      return "<p>" + safe.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
    }

    function sectionsHtml(sections) {
      return (sections || []).map(sec => `
        <div class="mb-5">
          <h2 class="text-base font-bold text-gray-900 mb-1">${sec.title}</h2>
          <div class="text-gray-600 text-sm leading-relaxed">${mdToHtml(sec.body)}</div>
        </div>
      `).join("");
    }

    function renderGuide(lang) {
      const t = HELP_TEXTS[lang] || HELP_TEXTS.en;
      document.documentElement.lang = lang;
      document.getElementById("pageTitle").textContent = t.headerTitle;
      document.getElementById("pageSubtitle").textContent = t.pageSubtitle;
      document.getElementById("guide").innerHTML = sectionsHtml((t.sections || []).slice(0, 2));
      document.getElementById("guideFull").innerHTML = sectionsHtml((t.sections || []).slice(2));

      const details = document.getElementById("guideDetails");
      const label = document.getElementById("labelTxt");
      const updateLabel = () => { label.textContent = details.open ? t.toggleHide : t.toggleShow; };
      updateLabel();
      details.addEventListener("toggle", updateLabel);
    }

    function setVideo(lang) {
      const vid = document.getElementById("vid");
      const err = document.getElementById("err");
      const src = `${BASE}LinkDex-${lang}.mp4`;
      vid.src = src;
      vid.load();
      vid.onerror = () => {
        err.classList.remove("hidden");
        err.textContent = `Error: Video not found (${lang})`;
      };
    }

    const currentLang = pickLang();
    renderGuide(currentLang);
    setVideo(currentLang);
  </script>
</body>
</html>
